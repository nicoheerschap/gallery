<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artwork from Yun Xie - Contact page">
    <meta name="keywords" content="Yun Xie, Art, Artwork, Painting, Sculpture, Kunst, Kunstwerken, Schilderij, Beeld, Contact">
    <meta name="author" content="Nico Heerschap">
    <meta name=”robots” content=”index, follow” />
    <meta name="google" content="notranslate">
    <title>Yun Xie Art - Contact Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url("zeist.png"); /* Background image */
            background-size: cover; /* Cover full screen */
            background-repeat: no-repeat;
            background-position: center center; /* Center alignment */
            min-height: 100vh; /* Ensures full height */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers all content horizontally */
        }

        .navbar {
            background-color: rgba(76, 175, 80, 0.9); /* Slight transparency */
            font-size: 16px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed; /* Fixed at the top */
            top: 0;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            text-align: center;
        }

        .navbar a:hover {
            background-color: #45a049;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        @media only screen and (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
                background-color: rgba(76, 175, 80, 0.9);
                width: 100%;
                position: absolute;
                top: 50px;
                left: 0;
                padding: 10px 0;
            }

            .menu a {
                padding: 10px;
                text-align: center;
                width: 100%;
            }

            .menu.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

        main {
            margin-top: 60px; /* Reduced space between navbar and text */
            flex-grow: 1; /* Ensures content fills available space */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers text horizontally */
            text-align: center; /* Centers text content */
        }

        h1 {
            font-size: 35px;
            margin-top: 0; /* Aligns directly below the green navbar */
        }

        p {
            margin: 15px 0;
        }

        .email-link {
            cursor: pointer;
            font-family: Rockwell, serif;
            color: black;
            text-decoration: underline;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            menu.classList.toggle('active');
        }

        function sendEmail() {
            location.href = "mailto:yunxie@xs4all.nl";
        }
    </script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="sculptures.html">Sculptures</a>
            <a href="paintings.html">Paintings</a>
            <a href="latestnews.html">News</a>
            <a href="contact.html"><b>Contact</b></a>
        </div>
    </nav>

    <main>
        <h1>Yun Xie Art</h1>
        <p><b>If you are interested in my work <br> or want to make an appointment:</b></p>

        <!-- Email clickable div -->
        <div align="center" class="email-link" onclick="sendEmail()">
            <b>Please click here to send me an e-mail</b>
        </div>
    </main>
</body>

</html>
