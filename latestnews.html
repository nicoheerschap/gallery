    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            overflow-y: auto; /* Allows scrolling */
        }

        .navbar {
            background-color: rgba(76, 175, 80, 0.9); /* Slightly transparent green bar */
            font-size: 16px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed; /* Fixed at the top */
            top: 0;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            text-align: center;
        }

        .navbar a:hover {
            background-color: #45a049;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        h1 {
            font-size: 35px;
            margin-top: 70px; /* Increased spacing below the green menu bar */
        }

        @media only screen and (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
                background-color: rgba(76, 175, 80, 0.9);
                width: 100%;
                position: absolute;
                top: 50px;
                left: 0;
                padding: 10px 0;
            }

            .menu a {
                padding: 10px;
                text-align: center;
                width: 100%;
            }

            .menu.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
                position: fixed;
                top: 10px;
                left: 50%;
                transform: translateX(-50%); /* Center toggle menu */
                z-index: 1001; /* Ensure it is above the menu */
            }

            iframe {
                width: 90%; /* Adjust video size for mobile */
                height: auto;
            }

            h1 {
                margin-top: 70px; /* Increased spacing for mobile devices */
            }
        }
    </style>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            menu.classList.toggle('active');
        }
    </script>
</head>
