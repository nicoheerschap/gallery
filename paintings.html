    body {

    .navbar {

      width: 100%;

      justify-content: center;
      align-items: center;

    .navbar a {

    .fotogroep {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .fotogroep figure {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      border: 2px solid #4CAF50;
      border-radius: 10px;
      overflow: hidden;
    }

    .fotogroep img {
      width: 350px;
      max-width: 100%;
      padding: 4px;
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .fotogroep figcaption {
      text-align: center;
      padding: 10px;
      background-color: #f8f8f8;
    }

    .zoom-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .zoom-container img {
      max-width: 98%;
      max-height: 90%;
      border: 5px solid #fff;
    }

    .zoom-container .close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 30px;
      color: #fff;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      background-color: yellow;
      font-size: 15px;
      padding: 10px 0;
      margin: 0;
    }

    @media only screen and (max-width: 768px) {
