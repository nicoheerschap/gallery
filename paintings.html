<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artwork from Yun Xie - Painting gallery">
    <meta name="keywords" content="Yun Xie, Art, Artwork, Painting, Sculpture, Kunst, Kunstwerken, Schilderij, Beeld">
    <meta name="author" content="Nico Heerschap">
    <meta name=”robots” content=”index, follow” />
    <meta name="google" content="notranslate">
    <title>Yun Xie Art - Painting Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
        }

        .navbar {
            background-color: #4CAF50;
            font-size: 16px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            text-align: center;
        }

        .navbar a:hover {
            background-color: #45a049;
        }

        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        @media only screen and (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
                background-color: #4CAF50;
                width: 100%;
                position: absolute;
                top: 50px;
                left: 0;
                padding: 10px 0;
            }

            .menu a {
                padding: 10px;
                text-align: center;
                width: 100%;
            }

            .menu.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

        h1 {
            font-size: 35px;
            margin-top: 20px;
        }

        h2 {
            font-size: 25px;
            margin-top: 20px;
        }

        .fotogroep {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .fotogroep figure {
            margin: 0;
            padding: 0;
            border: 2px solid #4CAF50;
            border-radius: 10px;
        }

        .fotogroep img {
            width: 350px;
            max-width: 100%;
            padding: 4px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .fotogroep figcaption {
            text-align: center;
            padding: 10px;
            background-color: #f8f8f8;
        }

        .zoom-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .zoom-container img {
            max-width: 98%;
            max-height: 90%;
            border: 5px solid #fff;
        }

        .zoom-container .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            background-color: yellow;
            padding: 10px 0;
            margin: 0;
        }
    </style>
    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            menu.classList.toggle('active');
        }

        function openZoom(imageSrc) {
            document.getElementById('zoomImage').src = imageSrc;
            document.getElementById('zoomContainer').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoomContainer').style.display = 'none';
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="sculptures.html">Sculptures</a>
            <a href="paintings.html"><b>Paintings</b></a>
            <a href="latestnews.html">News</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <h1>Yun Xie Art</h1>
    <h2>Painting Gallery</h2>

    <div class="fotogroep">
        <script>
            const paintings = [
                { src: "paintings/Painting-0.jpg", title: "Quan Yin 1", size: "40x120cm" },
                { src: "paintings/Painting-1.jpg", title: "Lady in blue", size: "60x80cm" },
                { src: "paintings/Painting-2.jpg", title: "Quan Yin 2", size: "60x80cm" },
                { src: "paintings/Painting-3.jpg", title: "Terracotta warrior", size: "30x40cm" },
                { src: "paintings/Painting-4.jpg", title: "Lady with flower ball", size: "30x40cm" },
                { src: "paintings/Painting-5.jpg", title: "Quan Yin 3", size: "40x50cm" },
                { src: "paintings/Painting-6.jpg", title: "Flute player", size: "50x50cm" },
                { src: "paintings/Painting-7.jpg", title: "Keith Richards", size: "30x40cm" },
                { src: "paintings/Painting-8.jpg", title: "Quan Yin 4", size: "40x50cm" },
                { src: "paintings/Painting-9.jpg", title: "Cinq man", size: "30x40cm" },
                { src: "paintings/Painting-10.jpg", title: "Fight Covid", size: "29x29cm" },
                { src: "paintings/Painting-11.jpg", title: "Music", size: "90x70cm" },
                { src: "paintings/Painting-12.jpg", title: "Portrait of woman", size: "30x40cm" },
                { src: "paintings/Painting-13.jpg", title: "Woman in front of painting", size: "60x50cm" },
                { src: "paintings/Painting-14.jpg", title: "Bed time", size: "70x70cm" },
                { src: "paintings/Painting-15.jpg", title: "Quan Yin 5", size: "50x60cm" }
            ];

            paintings.forEach(painting => {
                document.write(`
                    <figure>
                        <img src="${painting.src}" alt="${painting.title}" onclick="openZoom('${painting.src}')">
                        <figcaption><b>${painting.title}</b><br>Painting on Canvas, Size: ${painting.size}</figcaption>
                    </figure>
                `);
            });
        </script>
    </div>

    <div class="zoom-container" id="zoomContainer">
        <span class="close" onclick="closeZoom()">&times;</span>
        <img id="zoomImage" src="" alt="Zoomed image">
    </div>

    <div class="footer">
        <p>&copy; 2025 Yun Xie Art | All rights reserved</p>
    </div>
</body>
</html>
