<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artwork from Yun Xie - Sculpture gallery">
    <meta name="keywords" content="Yun Xie, Art, Artwork, Painting, Sculpture, Kunst, Kunstwerken, Schilderij, Beeld">
    <meta name="author" content="Nico Heerschap">
    <meta name=”robots” content=”index, follow” />
    <meta name="google" content="notranslate">
    <title>Yun Xie Art - Sculpture Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
        }

        .navbar {
            background-color: #4CAF50;
            font-size: 16px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            text-align: center;
        }

        .navbar a:hover {
            background-color: #45a049;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        @media only screen and (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
                background-color: #4CAF50;
                width: 100%;
                position: absolute;
                top: 50px;
                left: 0;
                padding: 10px 0;
            }

            .menu a {
                padding: 10px;
                text-align: center;
                width: 100%;
            }

            .menu.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

        h1 {
            font-size: 35px;
            margin-top: 20px;
        }

        h2 {
            font-size: 25px;
            margin-top: 20px;
        }

        .fotogroep {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .fotogroep figure {
            margin: 0;
            padding: 0;
            border: 2px solid #4CAF50;
            border-radius: 10px;
        }

        .fotogroep img {
            width: 350px;
            max-width: 100%;
            padding: 4px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .fotogroep figcaption {
            text-align: center;
            padding: 5px;
            background-color: #f8f8f8;
        }

        .zoom-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .zoom-container img {
            max-width: 98%;
            max-height: 90%;
            border: 5px solid #fff;
        }

        .zoom-container .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            background-color: yellow;
            font-size: 15px;
            padding: 10px 0;
            margin: 0;
        }
    </style>
    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            menu.classList.toggle('active');
        }

        function openZoom(imageSrc) {
            document.getElementById('zoomImage').src = imageSrc;
            document.getElementById('zoomContainer').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoomContainer').style.display = 'none';
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="sculptures.html"><b>Sculptures</b></a>
            <a href="paintings.html">Paintings</a>
            <a href="latestnews.html">News</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <h1>Yun Xie Art</h1>
    <h2>Sculpture Gallery</h2>

    </div>

    <div class="zoom-container" id="zoomContainer">
        <span class="close" onclick="closeZoom()">&times;</span>
        <img id="zoomImage" src="" alt="Zoomed image">
    </div>

    <div class="footer">
        <p>&copy; 2025 Yun Xie Art | All rights reserved</p>
    </div>
</body>
</html>
